[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulcanary"
version = "0.25.1"
description = "Local-first code defense, verified remediation, and security policy"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
vulcanary = "vulcanary.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vulcanary"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
