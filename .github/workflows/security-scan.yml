name: Vulcanary reusable security scan

on:
  workflow_call:
    inputs:
      vulcanary_ref:
        description: Immutable Vulcanary commit to install
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned Vulcanary
        env:
          VULCANARY_REF: ${{ inputs.vulcanary_ref }}
        run: |
          if [[ ! "$VULCANARY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "vulcanary_ref must be a full lowercase commit SHA" >&2
            exit 2
          fi
          pip install "vulcanary @ git+https://github.com/JesseS69/vulcanary.git@$VULCANARY_REF"
      - name: Run Semgrep Community Edition
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP:/reports" -w /src semgrep/semgrep:1.172.0 semgrep scan --config p/default --metrics off --json --json-output /reports/semgrep.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          test -s "$RUNNER_TEMP/semgrep.json"
      - name: Run Gitleaks
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/reports" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.0 git . --redact=100 --report-format json --report-path /reports/gitleaks.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          test -f "$RUNNER_TEMP/gitleaks.json"
      - name: Run Trivy
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP:/reports" -v "$RUNNER_TEMP/trivy-cache:/root/.cache" aquasec/trivy:0.73.0 fs --scanners vuln,misconfig --format json --output /reports/trivy.json --exit-code 0 /src
          test -s "$RUNNER_TEMP/trivy.json"
      - name: Run Checkov
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src bridgecrew/checkov:3.3.8 --directory /src --output json --soft-fail --quiet --compact > "$RUNNER_TEMP/checkov.json"
          test -s "$RUNNER_TEMP/checkov.json"
      - name: Build pull-request baseline
        if: github.event_name == 'pull_request'
        run: |
          git worktree add --detach "$RUNNER_TEMP/vulcanary-base" "${{ github.event.pull_request.base.sha }}"
          vulcanary "$RUNNER_TEMP/vulcanary-base" --json "$RUNNER_TEMP/vulcanary-baseline.json" --no-fail
      - name: Scan pull-request changes
        if: github.event_name == 'pull_request'
        run: vulcanary . --semgrep-json "$RUNNER_TEMP/semgrep.json" --gitleaks-json "$RUNNER_TEMP/gitleaks.json" --trivy-json "$RUNNER_TEMP/trivy.json" --checkov-json "$RUNNER_TEMP/checkov.json" --baseline-json "$RUNNER_TEMP/vulcanary-baseline.json" --github-annotations --sarif vulcanary.sarif --json vulcanary.json --sbom vulcanary.cdx.json --spdx vulcanary.spdx.json
      - name: Scan repository
        if: github.event_name != 'pull_request'
        run: vulcanary . --semgrep-json "$RUNNER_TEMP/semgrep.json" --gitleaks-json "$RUNNER_TEMP/gitleaks.json" --trivy-json "$RUNNER_TEMP/trivy.json" --checkov-json "$RUNNER_TEMP/checkov.json" --sarif vulcanary.sarif --json vulcanary.json --sbom vulcanary.cdx.json --spdx vulcanary.spdx.json
      - name: Upload SARIF
        if: ${{ always() && hashFiles('vulcanary.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: vulcanary.sarif
          category: vulcanary
      - name: Preserve Vulcanary reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulcanary-report
          path: |
            vulcanary.json
            vulcanary.sarif
            vulcanary.cdx.json
            vulcanary.spdx.json
          if-no-files-found: warn
          retention-days: 14
