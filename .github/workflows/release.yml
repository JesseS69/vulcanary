name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Verify wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/vulcanary-smoke"
          "$RUNNER_TEMP/vulcanary-smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/vulcanary-smoke/bin/vulcanary" --help
          "$RUNNER_TEMP/vulcanary-smoke/bin/vulcanary" . --offline --no-fail
      - name: Create checksums
        run: sha256sum dist/* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: vulcanary-release
          path: |
            dist/*
            SHA256SUMS.txt
            scripts/install-windows.ps1
          if-no-files-found: error

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vulcanary-release
          path: release
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/dist/* release/SHA256SUMS.txt release/scripts/install-windows.ps1 --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
