name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Verify wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/vulcanary-smoke"
          "$RUNNER_TEMP/vulcanary-smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/vulcanary-smoke/bin/vulcanary" --help
          "$RUNNER_TEMP/vulcanary-smoke/bin/vulcanary" . --offline --no-fail
      - name: Create checksums
        run: sha256sum dist/* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: vulcanary-release
          path: |
            dist/*
            SHA256SUMS.txt
            scripts/install-windows.ps1
            scripts/uninstall-windows.ps1
          if-no-files-found: error

  windows-lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and exercise install, upgrade, backup, restore, and uninstall
        shell: pwsh
        run: |
          python -m pip install build==1.3.0
          python -m build
          python -m venv "$env:RUNNER_TEMP\vulcanary-lifecycle"
          $python = "$env:RUNNER_TEMP\vulcanary-lifecycle\Scripts\python.exe"
          $cli = "$env:RUNNER_TEMP\vulcanary-lifecycle\Scripts\vulcanary.exe"
          & $python -m pip install (Get-ChildItem dist\*.whl).FullName
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\sample-repository" | Out-Null
          & $cli setup "$env:RUNNER_TEMP\sample-repository" --monitor-interval 300 --port 8765
          & $cli config-export "$env:RUNNER_TEMP\vulcanary-backup.json"
          & $python -m pip install --force-reinstall (Get-ChildItem dist\*.whl).FullName
          & $cli config-import "$env:RUNNER_TEMP\vulcanary-backup.json"
          & $python -m pip uninstall -y vulcanary
          if (-not (Test-Path "$HOME\.vulcanary\app.json")) { throw "Uninstall removed user configuration" }

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-lifecycle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vulcanary-release
          path: release
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/dist/* release/SHA256SUMS.txt release/scripts/install-windows.ps1 release/scripts/uninstall-windows.ps1 --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
