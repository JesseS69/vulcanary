name: Vulcanary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Vulcanary
        run: pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Scan repository
        run: vulcanary . --sarif vulcanary.sarif --json vulcanary.json
      - name: Preserve normalized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulcanary-report
          path: |
            vulcanary.json
            vulcanary.sarif
