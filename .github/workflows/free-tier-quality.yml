name: Free-tier quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel
      - name: Install wheel only
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Verify installed command and packaged assets
        run: |
          vulcanary --help
          python -c "from importlib.resources import files; from vulcanary.version import __version__; assert files('vulcanary').joinpath('dashboard_assets/index.html').is_file(); print(__version__)"
      - name: Run complete tests and public benchmark
        run: python -m unittest discover -s tests -v
      - name: Validate report contracts against pinned official schemas
        run: |
          python -m pip install -r tests/contracts/requirements.txt
          python -m unittest discover -s tests/contracts -p test_schemas.py -v
      - name: Offline self-scan
        run: vulcanary . --offline --no-fail

  upgrade-preservation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and install release candidate
        shell: bash
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
      - name: Verify configuration survives a package reinstall
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/vulcanary-home"
          mkdir -p "$HOME/demo"
          vulcanary setup --repository "$HOME/demo" --monitor-interval 900 --port 8877
          cp "$HOME/.vulcanary/app.json" "$RUNNER_TEMP/before.json"
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          import json, os
          from pathlib import Path
          before = json.loads(Path(os.environ['RUNNER_TEMP'], 'before.json').read_text())
          after = json.loads(Path.home().joinpath('.vulcanary/app.json').read_text())
          assert after == before
          assert after['monitor_interval'] == 900
          PY
      - name: Acquire hash-pinned published upgrade fixtures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.60.0 --repo JesseS69/vulcanary --pattern '*.whl' --dir upgrade-oldest
          gh release download v0.65.0 --repo JesseS69/vulcanary --pattern '*.whl' --dir upgrade-previous
      - name: Rehearse supported upgrades and package rollback in isolated homes
        shell: bash
        run: |
          candidate=(dist/*.whl)
          python scripts/rehearse_upgrade.py --old upgrade-oldest/vulcanary-0.60.0-py3-none-any.whl --candidate "${candidate[0]}"
          python scripts/rehearse_upgrade.py --old upgrade-previous/vulcanary-0.65.0-py3-none-any.whl --candidate "${candidate[0]}"
          python scripts/rehearse_upgrade.py --old upgrade-oldest/vulcanary-0.60.0-py3-none-any.whl --intermediate upgrade-previous/vulcanary-0.65.0-py3-none-any.whl --candidate "${candidate[0]}"
