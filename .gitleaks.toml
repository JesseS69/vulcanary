[extend]
useDefault = true

[[allowlists]]
description = "Exact synthetic AWS access key used by Vulcanary's detector test"
paths = ['''tests/test_scanner\.py''']
regexTarget = "match"
regexes = ['''AKIA[A]BCDEFGHIJKLMNOP''']

[[allowlists]]
description = "Synthetic vulnerable fixtures in the public rule benchmark"
paths = ['''benchmarks/cases\.json''']
